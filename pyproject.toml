[project]
name = "pyappdist"
version = "0.10.0"
description = "Build native installers for Python apps without hunting down hidden imports, data files, or plugins"
readme = "README.md"
# 3.11.4+ because tarfile's extractall(filter=...) kwarg (used by runtime
# extraction) first appeared in that patch release.
requires-python = ">=3.11.4"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Atsuo Ishimoto", email = "atsuoishimoto@gmail.com" },
]
keywords = [
    "installer", "packaging", "distribution", "wheel",
    "windows", "msi", "msix", "wix", "linux", "macos",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "tomlkit>=0.15.0",
    "wheel>=0.47.0",
]

[project.urls]
Homepage = "https://github.com/atsuoishimoto/pyappdist"
Documentation = "https://pyappdist.readthedocs.io/"
Repository = "https://github.com/atsuoishimoto/pyappdist"
Issues = "https://github.com/atsuoishimoto/pyappdist/issues"

[project.scripts]
pyappdist = "pyappdist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
    "uv-matrix>=0.0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv-matrix]

[tool.uv-matrix.matrix.build-installers]
project = ["datafiles", "helloworld", "matplotlibdemo", "niceguidemo",
           "pandascli", "pygamedemo", "pyside6demo", "pytorchdemo"]
target = ["win32-msi", "win32-store", "win32-image", "linux", "linux-image",
          "darwin-arm", "darwin-arm-dmg", "darwin-arm-image"]
exclude = [
    {project = "niceguidemo", target = "linux"},
    {project = "niceguidemo", target = "linux-image"},
]

tasks = ["build-installer"]

[tool.uv-matrix.tasks.build-installer]
when = "target.startswith(platform)"
continue-on-error = "environ.get('CI') == 'true'"   # in CI, keep building the rest after a failed cell
cwd = "samples/{{ project }}"
run = "uvx --with ../.. pyappdist build {{ target }}"
