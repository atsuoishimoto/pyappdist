[project]
name = "pyappdist"
version = "0.11.0"
description = "Build native installers for Python apps from pyproject.toml — Windows MSI/MSIX, macOS PKG/DMG/.app, Linux self-extracting"
readme = "README.md"
# 3.11.4+ because tarfile's extractall(filter=...) kwarg (used by runtime
# extraction) first appeared in that patch release.
requires-python = ">=3.11.4"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Atsuo Ishimoto", email = "atsuoishimoto@gmail.com" },
]
keywords = [
    "installer", "packaging", "distribution", "wheel",
    "windows", "msi", "msix", "wix", "linux", "macos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "tomlkit>=0.15.0",
    "wheel>=0.47.0",
]

[project.urls]
Homepage = "https://github.com/atsuoishimoto/pyappdist"
Documentation = "https://pyappdist.readthedocs.io/"
Repository = "https://github.com/atsuoishimoto/pyappdist"
Issues = "https://github.com/atsuoishimoto/pyappdist/issues"

[project.scripts]
pyappdist = "pyappdist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
    "uv-matrix>=0.0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv-matrix.vars]
machine = "platform.machine().lower()"
is_arm = "'arm' in machine or 'aarch' in machine"


[tool.uv-matrix.matrix.build-samples]
project = ["datafiles", "helloworld", "matplotlibdemo", "niceguidemo",
           "pandascli", "pygamedemo", "pyside6demo", "pytorchdemo",
           "pyvisionmarker"]
target = ["win32-msi", "win32-store", "win32-image", "win32-arm-msi",
          "win32-arm-store", "win32-arm-image", "linux", "linux-image",
          "linux-arm", "linux-arm-image", "darwin-arm", "darwin-arm-dmg",
          "darwin-arm-pkg", "darwin-arm-image"]

exclude = [
    {project = "niceguidemo", target = "linux"},
    {project = "niceguidemo", target = "linux-image"},
    {project = "niceguidemo", target = "linux-arm"},
    {project = "niceguidemo", target = "linux-arm-image"},
    # torch/torchvision publish no windows-arm64 wheels, so pyvisionmarker
    # defines no win32-arm-* targets.
    {project = "pyvisionmarker", target = "win32-arm-msi"},
    {project = "pyvisionmarker", target = "win32-arm-store"},
    {project = "pyvisionmarker", target = "win32-arm-image"}
]

tasks = ["build-sample"]


[tool.uv-matrix.tasks.build-sample]
when = """
  target.startswith(sys.platform) and (
    (is_arm and ('arm' in target))
    or ((not is_arm) and ('arm' not in target)))
"""
cwd = "samples/{{ project }}"
# Each target's intermediates tree is deleted as soon as its package is in
# dist/: the torch samples build a ~4 GB tree per target and there are up to
# four targets per OS, which otherwise fills a CI runner's disk (see
# samples/clean_build.py). `&&` keeps the tree when the build fails, so a
# failure is still debuggable.
run = "echo '-- {{project}} {{target}}' && uvx --with ../.. pyappdist build {{ target }} && python ../clean_build.py {{ target }}"
