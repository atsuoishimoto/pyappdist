name: Release

# Manually (workflow_dispatch) produce a release: compile the prebuilt launcher
# stubs on native Windows/macOS runners, run an E2E smoke test that uses them
# (the helloworld sample), build the wheel + sdist with the stubs bundled, and
# create the GitHub release (tag <version> from pyproject.toml, no "v" prefix,
# matching the existing tags) with those files attached. Publishing to PyPI is
# the separate manual publish.yml, which uploads the release's files as-is.
on:
  workflow_dispatch:

jobs:
  prebuilt-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0

      # The four Windows stubs ({x64, arm64} x {console, gui}); arm64 uses the
      # x64-hosted cross compiler preinstalled on the runner image. The
      # explicit selection makes a missing toolchain fail the release instead
      # of being skipped with a note.
      - name: Build prebuilt launcher stubs
        run: uv run pyappdist build-prebuilt windows-x86_64 windows-arm64

      # The UI extension supplies WixUI_Minimal, which the generated .wxs uses
      # when the msi target sets a license file.
      - name: Install WiX (v5, no OSMF fee)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      # With the stubs in place, launcher-build's "prebuilt" default takes the
      # prebuilt path, so this E2E exercises exactly what released wheels do
      # (resource patching instead of an MSVC compile).
      - name: E2E build (wheels -> runtime -> image -> launcher -> wix -> MSI + zip)
        env:
          # Set this secret only to sign; unset means ship unsigned (signing is
          # enabled with --code-sign below only when the secret is present).
          # e.g. 'signtool.exe sign /fd SHA256 /tr <ts-url> /td SHA256 /f cert.pfx /p $PWD "{file}"'
          PYAPPDIST_WIN_SIGN_CMD: ${{ secrets.PYAPPDIST_SIGN_CMD }}
        run: >
          uv run pyappdist build win32-msi win32-image -C samples/helloworld
          ${{ secrets.PYAPPDIST_SIGN_CMD != '' && '--code-sign' || '' }}

      - name: Smoke test (install -> run -> uninstall)
        shell: pwsh
        run: |
          $msi = (Get-Item samples/helloworld/appdist/win32-msi/dist/*.msi).FullName
          Start-Process msiexec -ArgumentList "/i `"$msi`" /qn" -Wait
          # win32-msi is a per-user package (scope = "user"), so it lands under
          # %LocalAppData%\Programs\<display name>.
          $exe = Join-Path $env:LOCALAPPDATA "Programs/Hello World/helloworld.exe"
          $out = & $exe
          if ($LASTEXITCODE -ne 0) { throw "exe exit code $LASTEXITCODE" }
          if ($out -notmatch "Hello from helloworld!") { throw "unexpected output: $out" }
          # The hidden launcher (app-entry = false) is installed and runnable,
          # but must have no Start Menu shortcut.
          $cli = Join-Path $env:LOCALAPPDATA "Programs/Hello World/hellocli.exe"
          $out = & $cli
          if ($LASTEXITCODE -ne 0) { throw "hellocli exit code $LASTEXITCODE" }
          if ($out -notmatch "Hello from helloworld!") { throw "unexpected hellocli output: $out" }
          $shortcuts = Join-Path $env:APPDATA "Microsoft/Windows/Start Menu/Programs/Hello World"
          if (Test-Path (Join-Path $shortcuts "hellocli.lnk")) { throw "hellocli must not get a shortcut" }
          if (-not (Test-Path (Join-Path $shortcuts "helloworld.lnk"))) { throw "helloworld shortcut missing" }
          Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait

      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-windows
          path: src/pyappdist/resources/prebuilt/
          if-no-files-found: error

  prebuilt-macos:
    runs-on: macos-26   # Apple Silicon; the stub is universal (arm64 + x86_64)
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0

      # Explicit selection, so a missing toolchain fails instead of skipping.
      - name: Build prebuilt launcher stub
        run: |
          uv run pyappdist build-prebuilt macos
          lipo -info src/pyappdist/resources/prebuilt/launcher-macos-universal

      # Ad-hoc signed (no signing secrets here): builds the .app from the
      # prebuilt stub + sidecar config, wraps it in a dmg, and runs it. The
      # sample's hellocli launcher (app-entry = false) must produce no .app of
      # its own but run embedded from the Hello World bundle, through its
      # per-executable sidecar.
      - name: E2E build + smoke test (.app in a dmg, prebuilt stub)
        run: |
          uv run pyappdist build darwin-arm-dmg -C samples/helloworld
          dmg=$(ls samples/helloworld/appdist/darwin-arm-dmg/dist/*.dmg)
          hdiutil attach "$dmg" -mountpoint /tmp/helloworld -nobrowse
          napps=$(ls -d /tmp/helloworld/*.app | wc -l | tr -d ' ')
          out=$(/tmp/helloworld/*.app/Contents/MacOS/helloworld)
          cliout=$(/tmp/helloworld/*.app/Contents/MacOS/hellocli)
          hdiutil detach /tmp/helloworld
          echo "$out / $cliout ($napps bundle(s))"
          test "$napps" -eq 1 || { echo "expected a single .app (hellocli is app-entry = false)" >&2; exit 1; }
          case "$out" in *"Hello from helloworld!"*) ;; *) echo "unexpected output" >&2; exit 1;; esac
          case "$cliout" in *"Hello from helloworld!"*) ;; *) echo "unexpected hellocli output" >&2; exit 1;; esac

      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-macos
          path: src/pyappdist/resources/prebuilt/
          if-no-files-found: error

  release:
    needs: [prebuilt-windows, prebuilt-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release + tag
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0

      - uses: actions/download-artifact@v8
        with:
          pattern: prebuilt-*
          path: src/pyappdist/resources/prebuilt/
          merge-multiple: true

      - name: Build wheel + sdist (with the prebuilt stubs bundled)
        run: |
          ls -l src/pyappdist/resources/prebuilt/
          for stub in launcher-windows-x86_64-console.exe launcher-windows-x86_64-gui.exe \
                      launcher-windows-arm64-console.exe launcher-windows-arm64-gui.exe \
                      launcher-macos-universal; do
            test -f "src/pyappdist/resources/prebuilt/$stub" || { echo "missing stub: $stub" >&2; exit 1; }
          done
          uv build
          unzip -l dist/*.whl | grep resources/prebuilt/
          test "$(unzip -l dist/*.whl | grep -c 'resources/prebuilt/launcher-')" -eq 5

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          gh release create "$version" dist/* \
            --target "$GITHUB_SHA" --title "$version" --generate-notes
