name: Publish to PyPI

# Manually (workflow_dispatch) publish a GitHub release's wheel + sdist to
# PyPI. Nothing is rebuilt: the files attached to the release (created by
# release.yml, with the prebuilt launcher stubs bundled) are uploaded as-is,
# so the GitHub release and PyPI always match.
#
# Auth uses OIDC Trusted Publishing, so no API token is needed.
# Register the Trusted Publisher on PyPI beforehand:
#   - PyPI Project: pyappdist
#   - Owner: atsuoishimoto / Repository: pyappdist
#   - Workflow: publish.yml
#   - Environment: pypi
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. 0.12.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyappdist
    permissions:
      id-token: write   # required to mint the OIDC token (Trusted Publishing)
      contents: read    # gh release download
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --pattern '*.whl' --pattern '*.tar.gz' --dir dist
          ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
