name: Build samples

# Manually (workflow_dispatch) build every project under samples/ on 5 runners
# (Linux / Windows / macOS-arm, plus arm64 Linux / Windows). The build is driven
# by uv-matrix's `build-installers` matrix (x86_64 + macOS targets).

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false   # one OS failing must not cancel the others
      matrix:
        include:
          - os: ubuntu-latest
            artifact: installers-linux
          - os: windows-latest
            artifact: installers-windows
          - os: macos-14          # Apple Silicon (arm64) runner
            artifact: installers-macos-arm
          - os: ubuntu-24.04-arm  # arm64 Linux runner
            artifact: installers-linux-arm
          - os: windows-11-arm    # arm64 Windows runner
            artifact: installers-windows-arm
    runs-on: ${{ matrix.os }}
    # The macOS signing secrets live in the `sign_macos` environment; only the
    # macOS cell enters it (an empty environment = none), so Linux/Windows runs
    # never touch it and any environment protection rules gate only macOS.
    environment: ${{ startsWith(matrix.os, 'macos') && 'sign_macos' || '' }}
    # Lifted to job level so the macOS signing step's `if` can test it — the
    # `secrets` context is not available in a step-level `if`, but `env` is.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0

      # WiX (for the Windows MSI) is a dotnet global tool. MSVC (cl.exe/rc.exe)
      # and the Windows SDK (makeappx, for MSIX) are preinstalled on
      # windows-latest / windows-11-arm and resolved automatically by pyappdist
      # via vswhere.
      # macOS Xcode CLT (clang/codesign/hdiutil/sips/iconutil) and Linux need nothing extra.
      - name: Install WiX (Windows only)
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2

      # --- macOS code-signing + notarization --------------------------------
      # Only the macapp/dmg/pkg targets are signed & notarized; the .run (macos)
      # format ships unsigned. Skipped automatically if the secrets below are
      # empty, so forks without an Apple Developer account still build.
      #
      # Required GitHub Actions secrets (Settings > Secrets and variables > Actions):
      #
      #   MACOS_CERTIFICATE_P12
      #     The "Developer ID Application" certificate + private key, exported
      #     from Keychain Access (select the cert, File > Export Items > .p12)
      #     and base64-encoded:  base64 -i cert.p12 | pbcopy
      #   MACOS_CERTIFICATE_PASSWORD
      #     The password you set when exporting that .p12.
      #   MACOS_SIGNING_IDENTITY
      #     The identity's full name, e.g.
      #     "Developer ID Application: Your Name (TEAMID)".
      #     List yours with:  security find-identity -v -p codesigning
      #
      # Optional, for the `pkg` format only — a .pkg is signed with a *different*
      # certificate type ("Developer ID Installer") than the .app bundles inside
      # it. Without these three the .pkg still builds, but is left unsigned and
      # is therefore not notarized either (an unsigned pkg is rejected by the
      # notary service, so pyappdist skips submission with a note):
      #
      #   MACOS_INSTALLER_CERTIFICATE_P12
      #     The "Developer ID Installer" certificate + private key, exported and
      #     base64-encoded exactly like MACOS_CERTIFICATE_P12 above.
      #   MACOS_INSTALLER_CERTIFICATE_PASSWORD
      #     The password you set when exporting that .p12.
      #   MACOS_INSTALLER_IDENTITY
      #     Its full name, e.g. "Developer ID Installer: Your Name (TEAMID)".
      #     Note `-p codesigning` does NOT list installer certificates — use
      #     plain:  security find-identity -v
      #
      #   MACOS_NOTARY_APPLE_ID
      #     Your Apple ID email (the Apple Developer account).
      #   MACOS_NOTARY_TEAM_ID
      #     Your 10-char Developer Team ID (Apple Developer > Membership).
      #   MACOS_NOTARY_PASSWORD
      #     An app-specific password (NOT your Apple ID password) generated at
      #     appleid.apple.com > Sign-In and Security > App-Specific Passwords.
      #
      # The temporary keychain's password is generated fresh each run below, so
      # it is deliberately NOT a secret.
      - name: Set up macOS signing
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          # Disposable password for the throwaway keychain — never leaves this step.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"

          # Create + unlock a temp keychain and add it to the search list
          # (alongside login, where the notary profile below is stored).
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN" -T /usr/bin/codesign

          # The Developer ID Installer certificate (pkg signing) is optional and
          # lands in the same keychain; productbuild/productsign need explicit
          # -T entries of their own to reach its private key.
          if [ -n "${MACOS_INSTALLER_CERTIFICATE_P12:-}" ]; then
            INSTALLER_CERT="$RUNNER_TEMP/installer-cert.p12"
            echo "$MACOS_INSTALLER_CERTIFICATE_P12" | base64 --decode > "$INSTALLER_CERT"
            security import "$INSTALLER_CERT" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" \
              -k "$KEYCHAIN" -T /usr/bin/productbuild -T /usr/bin/productsign
          fi

          # Let codesign/productbuild use the private keys without an
          # interactive prompt. This applies to every key in the keychain, so it
          # runs once after both imports; `apple:` covers productbuild, which is
          # an Apple-signed tool.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Create the notarytool keychain profile pyappdist expects. Omitting
          # --keychain stores it in the default login keychain, which pyappdist
          # reads back (also without --keychain).
          xcrun notarytool store-credentials pyappdist-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build samples
        env:
          # Windows signing command; it takes effect only for targets that enable
          # signing (a code-sign key or --code-sign). The sample targets ship
          # unsigned, so this is a hook for a fork that flips code-sign on.
          PYAPPDIST_WIN_SIGN_CMD: ${{ secrets.PYAPPDIST_SIGN_CMD }}
          # macOS: the Developer ID identities to sign with + the notarytool
          # profile created in the step above. Ignored on Windows/Linux runners
          # and when unset (macapp/dmg/pkg then fall back to ad-hoc, unnotarized).
          # The Application identity signs the .app bundles; the Installer one
          # signs the .pkg itself — a pkg needs both to be notarized.
          PYAPPDIST_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          PYAPPDIST_MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          PYAPPDIST_MACOS_NOTARY_PROFILE: pyappdist-notary
        run: uv run uv-matrix run --max-jobs 4 --matrix build-samples

      - name: Upload installers
        if: always()      # upload whatever built even if some cells failed
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: samples/*/appdist/*/dist/*
          if-no-files-found: warn
          retention-days: 7
