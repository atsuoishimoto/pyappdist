[project]
name = "pyvisonmarker"
version = "0.1.0"
description = "Gradio + pywebview local object-detection GUI sample for pyappdist"
readme = "README.md"
requires-python = ">=3.14"
# GPL-3.0: on Linux the app ships PyQt6/QtWebEngine (via pywebview[qt]), which
# is GPL v3. license-files ships the LICENSE text inside the wheel, so it also
# lands in the distributed install tree.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# The pywebview GUI backend is chosen with an environment marker rather than an
# extra: Linux gets pywebview[qt] (QtWebEngine), every other platform the plain
# package (WebView2 on Windows, WebKit on macOS). Because both entries live in
# [project.dependencies], a single `uv sync` — and every pyappdist target,
# without any per-target `extras` — already carries the right backend for the
# platform it builds for.
dependencies = [
    "gradio>=6.22.0",
    "pillow>=12.3.0",
    "pywebview>=6.2.1; sys_platform != 'linux'",
    "pywebview[qt]>=6.2.1; sys_platform == 'linux'",
    "safetensors>=0.8.0",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
]

[project.scripts]
pyvisonmarker = "pyvisonmarker.main:main"

# Unlike the other samples, pyappdist is not in a dev dependency group here:
# gradio pins tomlkit<0.15 and pyappdist requires >=0.15, so the two cannot
# share one environment. Build this sample with `uvx pyappdist build <target>`,
# which runs pyappdist in its own isolated environment.

[tool.pyappdist]
name = "Vision Inspector"
python = "3.14"
identifier = "com.example.pyvisonmarker"   # CFBundleIdentifier (required for macapp/dmg/pkg)

launchers = [
  { name = "pyvisonmarker", entry = "pyvisonmarker.main:main", gui = true, icon = { windows = "assets/pyvisonmarker.ico", macos = "assets/pyvisonmarker.png", linux = "assets/pyvisonmarker.png" } },
]

# torch / torchvision publish cp314 wheels for win_amd64, manylinux x86_64,
# manylinux aarch64 and macOS arm64 only — hence no windows-arm64 and no
# macos-x86_64 targets here.
[[tool.pyappdist.targets]]
name = "win32-msi"
platform = "windows-x86_64"
format = "msi"
# upgrade-code = "..."    # auto-generated and written back if omitted
manufacturer = "Example Inc."
license = "LICENSE.rtf"               # shows the GPL-3.0 text in the installer's license dialog
code-sign = false
allow-same-version-upgrades = false
add-to-path = true

[[tool.pyappdist.targets]]
name = "win32-store"
platform = "windows-x86_64"
format = "msix"
manufacturer = "Example Inc."

[[tool.pyappdist.targets]]
name = "linux"
platform = "linux-x86_64"
format = "linux"
categories = "Graphics;Science;"

[[tool.pyappdist.targets]]
name = "darwin-arm"
platform = "macos-aarch64"
format = "macos"

[[tool.pyappdist.targets]]
name = "darwin-arm-dmg"
platform = "macos-aarch64"
format = "dmg"                        # a signed/notarizable .app inside a .dmg

[[tool.pyappdist.targets]]
name = "darwin-arm-pkg"
platform = "macos-aarch64"
format = "pkg"                        # a .pkg installer (installs the .app into /Applications)
license = "LICENSE.rtf"               # Installer.app shows the GPL-3.0 text and asks to agree

[[tool.pyappdist.targets]]
name = "win32-image"
platform = "windows-x86_64"
format = "image"

[[tool.pyappdist.targets]]
name = "linux-image"
platform = "linux-x86_64"
format = "image"

[[tool.pyappdist.targets]]
name = "darwin-arm-image"
platform = "macos-aarch64"
format = "image"

[[tool.pyappdist.targets]]
name = "linux-arm"
platform = "linux-aarch64"
format = "linux"
categories = "Graphics;Science;"

[[tool.pyappdist.targets]]
name = "linux-arm-image"
platform = "linux-aarch64"
format = "image"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
