[project]
name = "datafiles"
version = "0.1.1"
description = "Sample app for pyappdist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.2.0",
]

[project.scripts]
datafiles = "datafiles.main:main"

[tool.pyappdist]
name = "Data files"
python = "3.12"
identifier = "com.example.datafiles"
launchers = [
  { name = "datafiles", entry = "datafiles.main:main", gui = false, icon = { macos = "assets/datafiles.png" } },
]

[[tool.pyappdist.targets]]
name = "win32-msi"
platform = "windows-x86_64"
format = "msi"
# upgrade-code = "..."    # auto-generated and written back if omitted
manufacturer = "Example Inc."
code-sign = false
allow-same-version-upgrades = false
add-to-path = true

[[tool.pyappdist.targets]]
name = "win32-store"
platform = "windows-x86_64"
format = "msix"
manufacturer = "Example Inc."

[[tool.pyappdist.targets]]
name = "linux"
platform = "linux-x86_64"
format = "linux"

[[tool.pyappdist.targets]]
name = "darwin-arm"
platform = "macos-aarch64"
format = "macos"

[[tool.pyappdist.targets]]
name = "macos-intel"
platform = "macos-x86_64"
format = "macos"

[[tool.pyappdist.targets]]
name = "darwin-arm-dmg"
platform = "macos-aarch64"
format = "dmg"

[[tool.pyappdist.targets]]
name = "darwin-arm-pkg"
platform = "macos-aarch64"
format = "pkg"                        # a .pkg installer (installs the .app into /Applications)

[[tool.pyappdist.targets]]
name = "win32-image"
platform = "windows-x86_64"
format = "image"

[[tool.pyappdist.targets]]
name = "linux-image"
platform = "linux-x86_64"
format = "image"

[[tool.pyappdist.targets]]
name = "darwin-arm-image"
platform = "macos-aarch64"
format = "image"

[[tool.pyappdist.targets]]
name = "win32-arm-msi"
platform = "windows-arm64"
format = "msi"
manufacturer = "Example Inc."
code-sign = false
allow-same-version-upgrades = false
add-to-path = true

[[tool.pyappdist.targets]]
name = "win32-arm-store"
platform = "windows-arm64"
format = "msix"
manufacturer = "Example Inc."

[[tool.pyappdist.targets]]
name = "win32-arm-image"
platform = "windows-arm64"
format = "image"

[[tool.pyappdist.targets]]
name = "linux-arm"
platform = "linux-aarch64"
format = "linux"

[[tool.pyappdist.targets]]
name = "linux-arm-image"
platform = "linux-aarch64"
format = "image"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyappdist>=0.1.1",
]

[tool.uv.build-backend]
data = { data = "data" }

