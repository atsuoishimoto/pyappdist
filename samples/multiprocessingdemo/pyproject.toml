[project]
name = "multiprocessingdemo"
version = "0.1.0"
description = "multiprocessing sample for pyappdist"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
multiprocessingdemo = "multiprocessingdemo:main"

[dependency-groups]
dev = [
    "pyappdist",
]

[tool.pyappdist]
name = "Multiprocessing Demo"
python = "3.12"
identifier = "com.example.multiprocessingdemo"

launchers = [
  { name = "multiprocessingdemo", entry = "multiprocessingdemo:main", gui = false },
]

[[tool.pyappdist.targets]]
name = "win32-msi"
platform = "windows-x86_64"
format = "msi"
# upgrade-code = "..."    # auto-generated and written back if omitted
manufacturer = "Example Inc."
code-sign = false
allow-same-version-upgrades = false
add-to-path = true

[[tool.pyappdist.targets]]
name = "win32-store"
platform = "windows-x86_64"
format = "msix"
manufacturer = "Example Inc."

[[tool.pyappdist.targets]]
name = "linux"
platform = "linux-x86_64"
format = "linux"

[[tool.pyappdist.targets]]
name = "darwin-arm"
platform = "macos-aarch64"
format = "macos"

[[tool.pyappdist.targets]]
name = "macos-intel"
platform = "macos-x86_64"
format = "macos"

[[tool.pyappdist.targets]]
name = "darwin-arm-dmg"
platform = "macos-aarch64"
format = "dmg"

[[tool.pyappdist.targets]]
name = "darwin-arm-pkg"
platform = "macos-aarch64"
format = "pkg"                        # a .pkg installer (installs the .app into /Applications)

[[tool.pyappdist.targets]]
name = "win32-image"
platform = "windows-x86_64"
format = "image"

[[tool.pyappdist.targets]]
name = "linux-image"
platform = "linux-x86_64"
format = "image"

[[tool.pyappdist.targets]]
name = "darwin-arm-image"
platform = "macos-aarch64"
format = "image"

[[tool.pyappdist.targets]]
name = "win32-arm-msi"
platform = "windows-arm64"
format = "msi"
manufacturer = "Example Inc."
code-sign = false
allow-same-version-upgrades = false
add-to-path = true

[[tool.pyappdist.targets]]
name = "win32-arm-store"
platform = "windows-arm64"
format = "msix"
manufacturer = "Example Inc."

[[tool.pyappdist.targets]]
name = "win32-arm-image"
platform = "windows-arm64"
format = "image"

[[tool.pyappdist.targets]]
name = "linux-arm"
platform = "linux-aarch64"
format = "linux"

[[tool.pyappdist.targets]]
name = "linux-arm-image"
platform = "linux-aarch64"
format = "image"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
